<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SkyCheck - Weather App</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./style.css">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
}

body {
    background: url('https://images.unsplash.com/photo-1503264116251-35a269479413?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
    text-align: center;
}

h2 {
    font-size: 36px;
    margin-bottom: 20px;
    text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
}

#container {
    background: rgba(255, 255, 255, 0.1);
    border-radius: 16px;
    padding: 30px 40px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255, 255, 255, 0.18);
    margin-top: 20px;
    min-width: 300px;
    display: none;
}

label {
    font-size: 18px;
    margin-right: 10px;
}

input[type="text"] {
    padding: 10px 15px;
    border-radius: 8px;
    border: none;
    outline: none;
    width: 200px;
    background-color: rgba(255, 255, 255, 0.2);
    color: white;
    font-size: 16px;
    margin-top: 10px;

    /* 👇 Add this line */
    margin-right: 10px;
}

button {
    margin-top: 10px;
    margin-left: 10px;
    padding: 10px 16px;
    border-radius: 8px;
    background: linear-gradient(45deg, #00c6ff, #0072ff);
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s ease;
}

button:hover {
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(0, 255, 255, 0.3);
}

#weatherIcon {
    width: 100px;
    height: 100px;
    margin: 15px auto;
    display: none;
}

#loading {
    font-size: 16px;
    margin-top: 15px;
    display: none;
}

p {
    font-size: 20px;
    margin: 10px 0;
}

#errorMsg {
    color: #ff6b6b;
    font-weight: bold;
    margin-top: 20px;
    font-size: 18px;
    text-shadow: 1px 1px 2px black;
}

@media (max-width: 600px) {
    #container {
        padding: 20px;
        width: 90%;
    }

    input[type="text"],
    button {
        width: 100%;
        margin-top: 10px;
    }

    label {
        display: block;
        text-align: center;
        margin-bottom: 5px;
    }
}

:root {
    --bg-color: #ffffff;
    --text-color: #000000;
    --card-bg: rgba(255, 255, 255, 0.2);
    --input-bg: rgba(0, 0, 0, 0.1);
}

body.dark {
    --bg-color: #1a1a1a;
    --text-color: #ffffff;
    --card-bg: rgba(255, 255, 255, 0.05);
    --input-bg: rgba(255, 255, 255, 0.1);
}

body {
    background: var(--bg-color);
    color: var(--text-color);
    transition: all 0.3s ease;
}

#container {
    background: var(--card-bg);
    transition: all 0.3s ease;
}

input[type="text"] {
    background-color: var(--input-bg);
    color: var(--text-color);
}

#errorMsg {
    color: #ff6b6b;
}

button#toggleTheme {
    position: absolute;
    top: 20px;
    right: 20px;
    padding: 8px 16px;
    border-radius: 20px;
    background: #333;
    color: white;
    border: none;
    cursor: pointer;
    font-size: 14px;
}

</style>
</head>

<body>

    <h2>🌤️ SkyCheck</h2>
    <button id="toggleTheme">🌙 Dark Mode</button>


    <img id="weatherIcon" src="https://openweathermap.org/img/wn/01d@2x.png" alt="Weather Icon" />

    <label for="name">City Name: <input type="text" id="name" /></label>
    <button id="submit">Get Weather</button>

    <p id="loading">Loading weather...</p>
    <p id="errorMsg"></p>

    <div id="container">
        <p>City Name: <span id="city"></span></p>
        <p>Temperature: <span id="temperature"></span></p>
        <p>Condition: <span id="condition"></span></p>
    </div>

    <script src="./weatherApp.js"></script>
<script>
const name = document.querySelector("#name");
const submit = document.querySelector("#submit");
const container = document.querySelector("#container");
const errorMsg = document.querySelector("#errorMsg");
const loading = document.querySelector("#loading");
const icon = document.querySelector("#weatherIcon");

name.addEventListener("keydown", function (e) {
    if (e.key === " ") e.preventDefault();
});

name.addEventListener("input", function () {
    this.value = this.value.replace(/\s/g, "");
});

async function load() {
    let nameValue = name.value.trim();

    if (nameValue === "") {
        errorMsg.innerText = "Invalid city name";
        errorMsg.style.display = "block";
        container.style.display = "none";
        icon.style.display = "none";
        return;
    }

    // Clear and prepare
    errorMsg.style.display = "none";
    loading.style.display = "block";
    container.style.display = "none";
    icon.style.display = "none";
    icon.src = "";

    const apiKey = "8bf942ee101de8f3ccb45afbd0ecc0d6";
    const url = `https://api.openweathermap.org/data/2.5/weather?q=${nameValue}&appid=${apiKey}&units=metric`;

    try {
        const res = await fetch(url);
        const data = await res.json();

        loading.style.display = "none";

        if (data.cod === "404") {
            errorMsg.innerText = "City not found. Please enter a valid city name.";
            errorMsg.style.display = "block";
            return;
        }

        document.querySelector("#city").innerText = data.name;
        document.querySelector("#temperature").innerText = data.main.temp + "°C";
        document.querySelector("#condition").innerText = data.weather[0].description;

        const iconCode = data.weather[0].icon;
        icon.src = `https://openweathermap.org/img/wn/${iconCode}@2x.png`;
        icon.style.display = "block";
        container.style.display = "block";

    } catch (err) {
        loading.style.display = "none";
        console.error("Error:", err);
        errorMsg.innerText = "Something went wrong. Please try again.";
        errorMsg.style.display = "block";
    }
}
name.addEventListener("keydown", (e) => {
    if (e.key === "Enter") load();
});

submit.addEventListener("click", load);

const themeToggle = document.querySelector("#toggleTheme");

themeToggle.addEventListener("click", () => {
    document.body.classList.toggle("dark");

    if (document.body.classList.contains("dark")) {
        themeToggle.textContent = "🌞 Light Mode";
    } else {
        themeToggle.textContent = "🌙 Dark Mode";
    }
});


</script>

</body>

</html>
